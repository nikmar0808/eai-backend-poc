networks:
  eai-mesh:
    driver: bridge
    # name: eai-mesh

volumes:
  postgres_persistent_engine_data:
    driver: local

services:
  # Node 1: Relational Enterprise Storage Tier
  postgres-db:
    image: postgres:16-alpine
    # container_name: postgres-db
    restart: always
    command: postgres -c log_timezone=Asia/Kolkata -c timezone=Asia/Kolkata
    environment:
      - POSTGRES_USER=smart_meter_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=smart_meter_warehouse
      - TZ=Asia/Kolkata
    ports: ["5432:5432"]
      # Comment above and uncomment the line below to override the host port for Postgres to prevent collision with another set of services on port 5432
      # Defaults to 5432 on the host if POSTGRES_HOST_PORT is unset
      # - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_persistent_engine_data:/var/lib/postgresql/data
    networks: [eai-mesh]
    # NEW — fixes the gap architecture.md Section 6.2.1 already flagged: without 
    # this, `depends_on` only waits for the container to start, not for Postgres 
    # to finish initializing and accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_meter_admin -d smart_meter_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  # Node 2: High-Speed Validation API Tier
  python-validator:
    build: { context: ./02-python-transformation-api, dockerfile: Dockerfile }
    #container_name: python-validator
    restart: always
    environment:
      - API_SECURITY_TOKEN=${API_SECURITY_TOKEN:?set in .env}
      - DATABASE_URL=postgresql+psycopg://smart_meter_admin:${POSTGRES_PASSWORD:?set in .env}@postgres-db:5432/smart_meter_warehouse
      - TZ=Asia/Kolkata
    ports: [8082:8082]
    # Comment above and uncomment the line below to override the host port for python-validator to prevent collision with another set of services on port 8082
      # Defaults to 8082 on the host if VALIDATOR_HOST_PORT is unset
      # - "${VALIDATOR_HOST_PORT:-8082}:8082"  # fine to keep exposed for LOCAL dev/testing — this is the dev compose file only
    depends_on:
      postgres-db: { condition: service_healthy }
    healthcheck:
      # Python's own /health runs SELECT 1 and answers 503 when the database is down. urlopen raises an exception on
      # any 4xx or 5xx answer, and "python -c" turns an uncaught exception into exit code 1, so the exit code is
      # non-zero exactly when the service is not ready. The slim image has no curl or wget, so Python is the client.
      # timeout=3 inside the command is shorter than the check's own timeout of 5s, so the command ends itself first.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s      # run every 10 seconds
      timeout: 5s        # a run longer than 5 seconds counts as a failure
      retries: 3         # three failures in a row: unhealthy
      start_period: 20s  # failures in the first 20 seconds are not counted
    networks: [eai-mesh]
  
  # Node 3: Enterprise Gateway Ingress Orchestrator
  java-gateway:
    build: { context: ./01-java-ingestion-service, dockerfile: Dockerfile }
    # container_name: java-gateway
    restart: always
    environment:
      - SERVER_PORT=8081
      # Remap destination URL target dynamically to use internal Docker DNS naming!
      - INTEGRATION_PYTHON_BASE-URL=http://python-validator:8082
      - INTEGRATION_PYTHON_AUTH-TOKEN=${API_SECURITY_TOKEN:?set in .env}
      - TZ=Asia/Kolkata
      - JAVA_OPTS=-Duser.timezone=Asia/Kolkata
      - SPRINGDOC_ENABLED=true
    ports: ["8081:8081"]
      # Comment above and uncomment the line below to override the host port for java-gateway to prevent collision with another set of services on port 8081
      # Defaults to 8081 on the host if GATEWAY_HOST_PORT is unset
      # - "${GATEWAY_HOST_PORT:-8081}:8081"  # fine to keep exposed for LOCAL dev/testing — this is the dev compose file only
    depends_on:
      # Start the gateway only when Python's health check has passed. The short form (a list) waits only for the
      # python-validator PROCESS to exist, which is the gap noted in the Azure window (B2.6).
      python-validator: { condition: service_healthy }
    healthcheck:
      # BusyBox wget exits non-zero on any HTTP error, including the 503 the gateway returns when Python is down.
      # -q quiet; -O /dev/null throw the body away (only the exit code matters).
      # 127.0.0.1, not localhost: the gateway listens on 0.0.0.0 (IPv4) and Alpine may resolve localhost to ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6         # more tolerance than Python: its answer depends on Python, and a JVM can pause briefly
      start_period: 40s  # Spring Boot needs about half a minute to start on a laptop
    networks: [eai-mesh]
