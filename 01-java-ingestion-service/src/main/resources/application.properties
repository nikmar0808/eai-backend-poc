server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

integration.python.base-url=${INTEGRATION_PYTHON_BASE-URL:http://localhost:8082}
integration.python.auth-token=${INTEGRATION_PYTHON_AUTH-TOKEN:}

# added for /health but failing vulnerability in dependency scan, so reverting for now
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.probes.enabled=true

logging.level.com.utility.ingestion=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}

# The choices, with the legacy comparison. The simple client opens a connection per call and pools nothing, 
# which is acceptable for a gateway at this volume. The Apache HttpClient (http-components) is the pooled, 
# keep-alive-tuned client that J2EE-era projects standardised on; it is the production choice when call volume
# makes connection reuse matter, at the cost of one more dependency.
# A custom JdkClientHttpRequestFactory pinned to HTTP/1.1 keeps the JDK client without the upgrade offer. 
# simple is chosen here because it is one line, and Spring Boot applies the timeout properties to it.
# Between services in production the usual answer is neither: a service mesh or
# an HTTP/2-capable server on both sides, with mutual TLS.
spring.http.client.factory=simple
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

# --- Stage 5: the gateway as an OAuth2 resource server (ADR-005) ---
# Three settings, each with a development default that matches the Compose overlay, so that the application context
# also starts in tests and in an IDE with nothing set. A default that is WRONG for a deployment fails closed: every
# token is refused. It can never accept a token it should not.
#
# What the gateway DEMANDS in the token's iss claim. It must equal what Keycloak writes (KC_HOSTNAME), character for
# character, trailing slash included or excluded. It is a name to compare, not an address to call.
security.jwt.issuer=${SECURITY_JWT_ISSUER:http://localhost:8180/realms/eai}
# Where the gateway FETCHES Keycloak's public keys. Inside Compose this is the container address, not localhost.
# The decoder reads this URL lazily, on the first token, so the gateway starts even if Keycloak is down.
security.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:http://localhost:8180/realms/eai/protocol/openid-connect/certs}
# Which API the token must be meant for.
security.jwt.audience=${SECURITY_JWT_AUDIENCE:eai-gateway}
