openapi: 3.0.3
info:
  title: EAI Ingestion Gateway API
  version: 0.1.0
  description: |
    Public API of java-gateway. Accepts bulk smart-meter readings, validates them, forwards them to
    python-validator and returns the analytics summary. Hand-written (contract-first): the code conforms to this
    document. Known deviations are listed in docs/api/README.md.
  contact:
    name: eai-backend-poc
    url: https://github.com/nikmar0808/eai-backend-poc
servers:
  - url: http://localhost:8081
    description: Local Docker Compose
tags:
  - name: Health
    description: Readiness of the gateway and its downstream dependency.
  - name: Ingestion
    description: Submission of meter readings.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getGatewayHealth
      summary: Gateway health
      description: |
        Reports the readiness of the gateway. The gateway is ready only when python-validator, and through it the
        database, is ready. `status` is the overall result; `pythonValidator` is the downstream result.
      responses:
        "200":
          description: Gateway and downstream service are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: The downstream service is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /api/v1/ingest/bulk:
    post:
      tags: [Ingestion]
      operationId: ingestBulk
      summary: Submit bulk meter readings
      description: |
        Validates the request, forwards it to python-validator and returns its analytics summary.
        If python-validator rejects, fails or is unreachable, the response is 502; if it does not answer in time, 504.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkIngestionRequest" }
            examples:
              valid:
                summary: One reading with voltage
                value:
                  meter_id: MTR-POC2-001
                  grid_zone: ZONE-A
                  readings:
                    - timestamp: "2026-10-09T00:00:00Z"
                      kwh_value: 12.5
                      voltage: 230.0
      responses:
        "200":
          description: Readings validated and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationResponse" }
        "400":
          description: The request body failed validation or is not well-formed JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "502":
          description: python-validator rejected the request, failed, or could not be reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: python-validator did not answer in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    BulkIngestionRequest:
      type: object
      required: [meter_id, grid_zone, readings]
      properties:
        meter_id:
          type: string
          minLength: 5
          maxLength: 20
          description: Unique utility asset identifier.
        grid_zone:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
          description: Regional grid zone code. Must contain at least one non-space character.
        readings:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/MeterReading" }
    MeterReading:
      type: object
      required: [timestamp, kwh_value]
      properties:
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 date-time. A UTC offset is mandatory; a time without one is rejected.
        kwh_value:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          exclusiveMinimum: true
          description: Active energy consumption in kWh. Strictly greater than zero.
        voltage:
          type: number
          format: double
          minimum: 100
          maximum: 300
          nullable: true
          description: Optional grid voltage reading, 100 to 300 inclusive.
    TransformationResponse:
      type: object
      required: [message, metadata, analytics_summary]
      properties:
        message: { type: string }
        metadata:
          type: object
          required: [processed_asset, regional_zone, intervals_saved]
          properties:
            processed_asset: { type: string }
            regional_zone: { type: string }
            intervals_saved: { type: integer }
        analytics_summary:
          type: object
          required: [cumulative_kwh, average_load_per_interval]
          properties:
            cumulative_kwh: { type: number, format: double }
            average_load_per_interval: { type: number, format: double }
    HealthStatus:
      type: object
      required: [status, pythonValidator]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: Overall readiness of the gateway.
        pythonValidator:
          type: string
          enum: [UP, DOWN]
          description: Result of the downstream health probe.
    ValidationErrorResponse:
      type: object
      required: [timestamp, status, error, details]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 400 }
        error: { type: string, example: Validation failed }
        details:
          type: object
          additionalProperties: { type: string }
          description: Map from field name to the rule that failed.
    ErrorResponse:
      type: object
      required: [timestamp, status, error]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
