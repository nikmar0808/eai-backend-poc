[pytest]
filterwarnings =
    # Suppress Starlette's custom deprecation subclass explicitly
    ignore::DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    db: tests that need a live PostgreSQL database (deselect with -m "not db")
