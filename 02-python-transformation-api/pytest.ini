[pytest]
; Where pytest looks for tests when no path is given on the command line.
testpaths = tests
; Adds the service folder to Python's import path, so "from app..." works however pytest is started.
; (Maven's equivalent: the main classes are on the test classpath automatically.)
pythonpath = .
; -ra : in the summary, give a one-line reason for everything that did not simply pass.
; --strict-markers : a misspelt marker (for example @pytest.mark.dp) is an ERROR, not a silently unlabelled test.
addopts = -ra --strict-markers
; Markers must be declared here when --strict-markers is on. "db" labels tests that need PostgreSQL.
markers =
    db: tests that need a live PostgreSQL database (deselect with -m "not db")
; Suppress Starlette's custom deprecation subclass explicitly. Without this, pytest will show a warning
; about the deprecation of the subclass itself, even though the subclass is not used in this project.
; pytest --collect-only command shows this:
; .venv\Lib\site-packages\fastapi\testclient.py:1
;   StarletteDeprecationWarning: Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.
;     from starlette.testclient import TestClient as TestClient  # noqa

; .venv\Lib\site-packages\starlette\testclient.py:53
;   DeprecationWarning: The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.
;     _PortalFactoryType = Callable[[], AbstractContextManager[anyio.abc.BlockingPortal]]
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
