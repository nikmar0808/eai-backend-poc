[pytest]
# Where pytest looks for tests when run without a path: this folder.
testpaths = .
# -ra : at the end, print one line for every test that was not a plain pass (skipped, failed, errors) with its reason.
# --strict-markers : a marker not registered below is an error, so a misspelt @pytest.mark.resilence cannot silently
#                    select nothing.
addopts = -ra --strict-markers
markers =
    resilience: stops and restarts containers (slow); deselect with -m "not resilience"
