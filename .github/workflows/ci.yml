name: CI

# Derived from eai-azure-poc's ci.yml (see docs/ORIGIN.md).
# Kept unchanged: secret-scan, dependency-scan, java-build-test, python-build-test, image-scan.
# Removed: node-build-check and react-build (the frontends are not in this repository), publish-images and
# deploy-poc (they need an Azure subscription and the GitHub Environment "poc").
# Job names are what branch rules call "required status checks": no job is renamed. Later gates are added to this file.
#   push to develop or feature/**, and every pull request -> scans + build/test of both services
#   pull_request                                           -> image-scan: build and Trivy-scan each image, push nothing
# Added in POC 2: contract-lint (Stage 1)
# Added in POC 2: e2e (Stage 4): the real stack, the cross-service suite, Schemathesis (blocking since Stage 7).
# Added in POC 2, Stage 7: ruff and mypy (a ratchet) in python-build-test. Two more workflows hold the other Stage 7
# gates: contract-check.yml (contract-breaking-change, oasdiff) and nightly-scan.yml (scheduled scans, ADR-012).


on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Report "verified" (provably live) AND "unknown" (could not be checked) findings. Verified-only mode can never
      # flag a home-made token, because there is no issuer to verify it against.
      - uses: trufflesecurity/trufflehog@v3.99.7
        with: { extra_args: "--results=verified,unknown" }
      # Gitleaks: generic secret rules plus the project's own retired literals. The literals live in the repository
      # secret GITLEAKS_PROJECT_REGEX, never in the repository, and --redact keeps any finding out of this public log.
      - name: Gitleaks scan of the full history
        env:
          PROJECT_REGEX: ${{ secrets.GITLEAKS_PROJECT_REGEX }}
        run: |
          set -e
          if [ -z "$PROJECT_REGEX" ]; then echo "::error::repository secret GITLEAKS_PROJECT_REGEX is not set"; exit 1; fi
          {
            echo '[extend]'
            echo 'useDefault = true'
            echo '[[rules]]'
            echo 'id = "eai-project-literals"'
            echo "regex = '''${PROJECT_REGEX}'''"
          } > "$RUNNER_TEMP/gitleaks.toml"
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" \
            zricethezav/gitleaks:latest detect --source /repo --config /gitleaks.toml --redact -v

  dependency-scan:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
      # Step 1: results for the Security tab. Never fails the job (exit-code 0). SARIF is a machine format and
      # prints no findings in the log, which is why the gate is a second step.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0
          format: sarif
          output: trivy-fs-results.sarif
      - if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy-fs-results.sarif }
      # Step 2: the gate. Same scan, readable table, fails the job on any remaining finding.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
          format: table

  contract-lint:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Warnings fail the job: the contract has to be clean, not merely valid.
      - run: npx --yes @stoplight/spectral-cli@6 lint --fail-severity warn docs/api/gateway.openapi.yaml docs/api/validator.openapi.yaml

  java-build-test:
    needs: [secret-scan, dependency-scan]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - working-directory: 01-java-ingestion-service
        run: mvn -B verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: 01-java-ingestion-service/target/site/jacoco
          if-no-files-found: ignore
          
  python-build-test:
    needs: [secret-scan, dependency-scan]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smart_meter_admin
          POSTGRES_PASSWORD: ci-only-test-password # disposable CI test value, not an actual credential
          POSTGRES_DB: smart_meter_warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip                                              # reuses downloaded packages between runs
          cache-dependency-path: 02-python-transformation-api/requirements*.txt   # the cache key now covers both files
      - working-directory: 02-python-transformation-api
        run: pip install -r requirements-dev.txt                 # runtime + test tools (was: requirements.txt only)
      # Stage 7: lint, then types, then tests. The cheapest check runs first, so a slip fails in seconds.
      # ruff reads ruff.toml in this folder: a pinned rule set, because ruff's default set grew in 0.16.
      - name: Lint (ruff)
        working-directory: 02-python-transformation-api
        run: ruff check app tests
      # A ratchet: the three known errors of D24 (app/api/readings.py, owned by POC 3) are allowed, a fourth fails the
      # job. MYPY_MAX only ever goes down: when D24 is fixed, it becomes 0 in the same pull request.
      - name: Type check (mypy, ratchet)
        working-directory: 02-python-transformation-api
        env:
          MYPY_MAX: "3"
        run: |
          python -m mypy app --ignore-missing-imports > "$RUNNER_TEMP/mypy.txt" 2>&1 || true
          cat "$RUNNER_TEMP/mypy.txt"
          # mypy's last line says how the check ended; without it (a crash, a bad option) zero errors would mean nothing.
          grep -Eq '^(Success: no issues found|Found [0-9]+ errors? in)' "$RUNNER_TEMP/mypy.txt" || { echo "::error::mypy did not complete its check"; exit 1; }
          COUNT=$(grep -c ': error:' "$RUNNER_TEMP/mypy.txt" || true)
          echo "mypy errors: $COUNT, allowed: $MYPY_MAX"
          if [ "$COUNT" -gt "$MYPY_MAX" ]; then echo "::error::mypy reports $COUNT errors, at most $MYPY_MAX are allowed (D24). Fix the new ones."; exit 1; fi
          if [ "$COUNT" -lt "$MYPY_MAX" ]; then echo "::notice::mypy reports $COUNT errors: lower MYPY_MAX to $COUNT in this pull request."; fi
      - working-directory: 02-python-transformation-api
        env:
          DATABASE_URL: postgresql+psycopg://smart_meter_admin:ci-only-test-password@127.0.0.1:5432/smart_meter_warehouse # disposable CI test value, not an actual credential
          API_SECURITY_TOKEN: ci-only-test-token # disposable CI test value, not an actual credential
        run: pytest tests --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=92
      - if: always()                    # upload the report even when the tests or the gate failed
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: 02-python-transformation-api/htmlcov
          if-no-files-found: ignore

  # Pull requests only: build each image and scan it, push nothing. A vulnerable image blocks a merge before it
  # reaches develop. fail-fast is off so that one vulnerable image does not hide the result for the other.
  image-scan:
    name: image-scan (${{ matrix.image }})
    needs: [java-build-test, python-build-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: eai-java-gateway,     context: 01-java-ingestion-service }
          - { image: eai-python-validator, context: 02-python-transformation-api }
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{ matrix.image }}:pr ./${{ matrix.context }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
  # Starts the real stack (gateway, Python service, PostgreSQL) and tests across the service boundary. The stack is
  # built from the pull request's own code, so a change that breaks the gateway/Python contract fails here and
  # nowhere earlier. The .env values are random, exist only on this runner and are masked in the log.
  e2e:
    # Start only after the two fast unit/slice jobs have passed: no point building a stack for broken code.
    needs: [java-build-test, python-build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25        # a hung stack costs 25 minutes, not the default six hours
    # Same triggers as python-build-test (Step 1 decides whether these four lines stay).
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')))
    steps:
      - uses: actions/checkout@v7          # fetch the pull request's code onto the runner
      - name: Create .env with throw-away random values
        run: |
          set -e                            # stop at the first failing command
          PW=$(openssl rand -hex 16)        # 32 random hex characters
          TOKEN=$(openssl rand -hex 24)     # 48 random hex characters
          KCADMIN=$(openssl rand -hex 16)   # Keycloak's bootstrap admin password (never used by a test)
          KCSECRET=$(openssl rand -hex 24)  # the shared client secret of the three realm clients (5.3)
          echo "::add-mask::$PW"            # replace these values with *** in every later log line
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$KCADMIN"
          echo "::add-mask::$KCSECRET"
          printf 'POSTGRES_PASSWORD=%s\nAPI_SECURITY_TOKEN=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\nKEYCLOAK_CLIENT_SECRET=%s\n' "$PW" "$TOKEN" "$KCADMIN" "$KCSECRET" > .env
          echo "POSTGRES_PASSWORD=$PW" >> "$GITHUB_ENV"              # visible to later steps: the test process and
          echo "API_SECURITY_TOKEN=$TOKEN" >> "$GITHUB_ENV"          # the Schemathesis and token steps
          echo "KEYCLOAK_CLIENT_SECRET=$KCSECRET" >> "$GITHUB_ENV"
      - name: Start the stack and wait until every service is healthy
        run: |
          docker compose version
          docker compose -f docker-compose.dev.yml -f docker-compose.security.yml up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v7       # a Python for the test process (the services run in containers)
        with:
          python-version: "3.14"
          cache: pip                         # cache downloaded packages between runs
          cache-dependency-path: e2e/requirements.txt    # the cache key is the hash of this file
      - run: pip install -r e2e/requirements.txt
      - name: End-to-end tests
        run: python -m pytest e2e            # from the repository root; support.py defaults to 127.0.0.1
      # Blocking since Stage 7 (docs/api/README.md, "CI gates on the contracts"): any Schemathesis report fails the job.
      # Two separate steps: each step runs under bash -e, so findings in a first run would stop a second run in the
      # same step. --continue-on-failure: keep generating cases for an operation after its first failure.
      - name: Schemathesis against the Python contract
        run: >
          docker run --rm --network host -v "$PWD:/w" schemathesis/schemathesis:4.31.1
          run /w/docs/api/validator.openapi.yaml --url http://127.0.0.1:8082
          -H "X-EAI-TOKEN: $API_SECURITY_TOKEN" --checks all --continue-on-failure
      # The gateway contract requires a bearer token (5.14). A step of its own, so that the token is fetched just
      # before the run that needs it (tokens live 300 s; the run takes about ten), masked, and passed on through
      # GITHUB_ENV. GitHub runs bash with -e and pipefail, so a failed curl or a body without a token fails the step.
      - name: Token for the gateway contract run
        run: |
          GW_TOKEN=$(curl -sS -d grant_type=client_credentials -d client_id=ingest-client -d "client_secret=$KEYCLOAK_CLIENT_SECRET" http://127.0.0.1:8180/realms/eai/protocol/openid-connect/token | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$GW_TOKEN"
          echo "GW_TOKEN=$GW_TOKEN" >> "$GITHUB_ENV"
      # One check is switched off, by name, with its reason (D47, accepted by design in Stage 6): Tomcat refuses TRACE
      # with 400 before Spring runs, so unsupported_method can never pass here, and production edges block TRACE.
      # Every other check of --checks all stays on.
      - name: Schemathesis against the gateway contract
        run: >
          docker run --rm --network host -v "$PWD:/w" schemathesis/schemathesis:4.31.1
          run /w/docs/api/gateway.openapi.yaml --url http://127.0.0.1:8081
          -H "Authorization: Bearer $GW_TOKEN" --checks all --exclude-checks unsupported_method --continue-on-failure
      - name: Service logs (on failure)
        if: failure()                        # only after an earlier, non-advisory step failed
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.security.yml ps -a
          docker compose -f docker-compose.dev.yml -f docker-compose.security.yml logs --no-color --tail 200
      - name: Tear the stack down
        if: always()                         # even after a failure or a cancellation
        run: docker compose -f docker-compose.dev.yml -f docker-compose.security.yml down -v
